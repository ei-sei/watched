name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: watched_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Vet backend
        run: |
          cd backend
          go vet ./...

      - name: Test backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/watched_test?sslmode=disable
          JWT_SECRET_KEY: test-secret-not-for-production
        run: |
          cd backend
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint frontend
        run: |
          cd frontend
          npm ci
          npm run lint

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/watched

            git pull origin main

            docker compose -f docker-compose.selfhost.yml up --build -d --remove-orphans
            docker image prune -af --filter "until=24h"

            sleep 10
            curl -sf http://localhost/health || echo "Health check failed!"
