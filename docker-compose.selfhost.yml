version: "3.9"

services:
  api:
    image: ghcr.io/ei-sei/watched-api:latest
    container_name: watched-api
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      ENVIRONMENT: production
      PORT: "8000"
    networks:
      - watched_net
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: ghcr.io/ei-sei/watched-web:latest
    container_name: watched-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - watched_net
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  watched_net:
    driver: bridge
