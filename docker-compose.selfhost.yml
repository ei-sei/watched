version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: watched-db
    restart: always
    environment:
      POSTGRES_DB: watched
      POSTGRES_USER: watched
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - watched_net
    deploy:
      resources:
        limits:
          memory: 256M
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=20
        -c wal_buffers=4MB
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=1000

  api:
    image: ghcr.io/ei-sei/watched-api:latest
    container_name: watched-api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://watched:${DB_PASSWORD}@db:5432/watched?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      ENVIRONMENT: production
      PORT: "8000"
    networks:
      - watched_net
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: ghcr.io/ei-sei/watched-web:latest
    container_name: watched-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - watched_net
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:

networks:
  watched_net:
    driver: bridge
